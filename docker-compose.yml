version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - KOKORO_API_KEY=${KOKORO_API_KEY}
      - DEFAULT_TTS_PROVIDER=${DEFAULT_TTS_PROVIDER:-openai}
    volumes:
      - ./uploads:/usr/src/app/uploads
      - ./outputs:/usr/src/app/outputs
      - ./logs:/usr/src/app/logs
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-data:
